server.port=${SERVER_PORT}
spring.application.name=control-tower

# ECS-shaped JSON log file for Alloy/Loki, console stays plain. LOG_FILE points at ./logs/control-tower/control-tower.json locally
logging.file.name=${LOG_FILE}
logging.structured.format.file=ecs
logging.structured.ecs.service.name=control-tower
logging.logback.rollingpolicy.max-history=14
logging.logback.rollingpolicy.max-file-size=50MB

# Trace/span ids only correlate log lines across services here - no exporter/backend configured, sampling every request since this is dev-scale
management.tracing.sampling.probability=1.0
# Reactive (WebFlux/Netty) - without this the trace id set on the request thread doesn't survive a hop to another Reactor operator/thread, so downstream log lines in the same request lose it
spring.reactor.context-propagation=auto

# Shared with shieldwall's JWT_SECRET - control-tower only verifies signature/expiry here, doesn't issue tokens. Secret is expected base64-encoded. No fallback default on purpose - fail loudly
jwt.secret=${JWT_SECRET}

# New service = new route block. No fallback defaults on purpose - fail loudly instead of silently routing to a guessed port; see .env for the actual values
spring.cloud.gateway.server.webflux.routes[0].id=shieldwall
spring.cloud.gateway.server.webflux.routes[0].uri=${SHIELDWALL_URI}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.server.webflux.routes[1].id=wirehood
spring.cloud.gateway.server.webflux.routes[1].uri=${WIREHOOD_URI}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/wirehood/**

# CORS handled by CorsConfig's CorsWebFilter bean instead of gateway's own globalcors property
# block - that block only ever applied to gateway-routed paths (/api/auth/**, /wirehood/**), not
# to plain @RestController endpoints living directly in this app (e.g. HealthController), which
# silently got zero CORS headers. One filter covering every path, gateway-routed or not, instead
# of two independent CORS configurations that would otherwise double up on the gateway-routed ones.
# CORS_ALLOWED_ORIGINS (comma-separated frontend origins) still comes from .env, read directly by
# CorsConfig - no fallback default on purpose, fail loudly instead of silently allowing nothing/everything.

management.endpoints.web.exposure.include=health

# Coarse per-IP throttle across every route this gateway proxies - see RateLimitFilter. Distinct
# from shieldwall's own auth-endpoint-specific limiter.
app.rate-limit.max-requests=1200
app.rate-limit.window-seconds=60

# Same shared Redis instance, reads credentials_version bumps shieldwall writes there, see JwtAuthenticationFilter
# Authenticates as its own scoped ACL user, not the default/full-access user - see docker-compose.yml's redis service
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.username=control-tower
spring.data.redis.password=${REDIS_PASSWORD}
# Explicit command/connect timeouts - without these a stale connection (e.g. after the redis
# container gets recreated while this service is still running) hangs every gated request behind
# it instead of throwing, which silently defeats the documented fail-open behavior on both Redis
# checks in JwtAuthenticationFilter and the coarse throttle in RateLimitFilter
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=2s
