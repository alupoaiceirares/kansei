server.port=${SERVER_PORT}
spring.application.name=control-tower

# Shared with shieldwall's JWT_SECRET - control-tower only verifies signature/expiry here, doesn't issue tokens. Secret is expected base64-encoded. No fallback default on purpose - fail loudly
jwt.secret=${JWT_SECRET}

# New service = new route block. No fallback defaults on purpose - fail loudly instead of silently routing to a guessed port; see .env for the actual values
spring.cloud.gateway.server.webflux.routes[0].id=shieldwall
spring.cloud.gateway.server.webflux.routes[0].uri=${SHIELDWALL_URI}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.server.webflux.routes[1].id=wirehood
spring.cloud.gateway.server.webflux.routes[1].uri=${WIREHOOD_URI}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/wirehood/**

management.endpoints.web.exposure.include=health
