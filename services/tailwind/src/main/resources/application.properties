server.port=${SERVER_PORT}
spring.application.name=tailwind

# ECS-shaped JSON log file for Alloy/Loki, console stays plain. LOG_FILE points at ./logs/tailwind/tailwind.json locally
logging.file.name=${LOG_FILE}
logging.structured.format.file=ecs
logging.structured.ecs.service.name=tailwind
logging.logback.rollingpolicy.max-history=14
logging.logback.rollingpolicy.max-file-size=50MB

# Trace/span ids only correlate log lines across services here, no exporter/backend configured, sampling every request since this is dev-scale
management.tracing.sampling.probability=1.0
# spring-boot-starter-opentelemetry also auto-enables an OTLP metrics exporter that pushes to localhost:4318 every minute, not wanted, off explicitly to stop the connection-refused spam
management.otlp.metrics.export.enabled=false
management.endpoints.web.exposure.include=health

# No fallback defaults here on purpose, a missing env var should fail loudly instead of silently trying a guessable/wrong value
# DB_HOST is localhost for mvn/IntelliJ, overridden to the postgres-tailwind service name when this app runs in the compose network
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.sql

# Same shared Redis instance, authenticates as its own scoped ACL user (~tailwind:* only), see docker-compose.yml's redis service
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.username=tailwind
spring.data.redis.password=${REDIS_PASSWORD}
# Explicit timeouts, without them a stale connection after the redis container gets recreated hangs a blocking call forever instead of throwing
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=2s

# Service-to-service call to shieldwall's internal user lookup, never routed through control-tower. Secret must match INTERNAL_SERVICE_SECRET in services/shieldwall/.env
shieldwall.internal-uri=${SHIELDWALL_INTERNAL_URI}
internal.service-secret=${INTERNAL_SERVICE_SECRET}

# Travel profile read side must live under /tailwind/** to match control-tower routing, the default /graphql would 404 through the gateway
# spring.graphql.path is deprecated and does not bind on this Boot build, spring.graphql.http.path is the real property
spring.graphql.http.path=/tailwind/graphql
spring.graphql.schema.locations=classpath:graphql/

# RabbitMQ, publishes audit.events (fdr consumes) and later mail.events (courier-one consumes)
# Own scoped user, not the broker admin login, provisioned by infra/rabbitmq/init-users.sh
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
# Confirms and returns so AuditPublisher can catch a nack or an unroutable message and fall back to a local file
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.template.observation-enabled=true

# Appended to when a publish to audit.events fails outright or gets nacked/returned, never replayed automatically
audit.fallback-file=${AUDIT_FALLBACK_FILE}

# Daily job that removes tailwind users whose shieldwall account was purged
tailwind.account-reconcile.cron=0 30 3 * * *

# Flight data through API.Market. The key only travels in a request header and is never logged
aerodatabox.base-url=https://prod.api.market/api/v1/aedbx/aerodatabox
aerodatabox.api-key=${AERODATABOX_API_KEY}
# Plan cap in units per month (see the API.Market dashboard), lookups are refused once the guarded percent is used
aerodatabox.monthly-unit-cap=${AERODATABOX_MONTHLY_UNIT_CAP}
aerodatabox.quota-guard-percent=90
# A flight lookup costs 2 units
aerodatabox.units-per-lookup=2

# Per-user cap on lookups that really hit the provider, and how long a not-found flight is remembered
tailwind.lookup.max-per-hour=20
tailwind.lookup.miss-cache-minutes=60
# The provider only has the last 365 days, schedules exist at least 2 months ahead
tailwind.lookup.max-past-days=365
tailwind.lookup.max-future-days=365

# Flights added before they flew get one refresh after landing. The daily job retries within the window, then leaves it to the button
tailwind.flight-refresh.cron=0 30 4 * * *
tailwind.flight-refresh.window-days=3
tailwind.flight-refresh.grace-hours=2
# The refresh button, once per flight per cooldown, also counted toward the per-user lookup limit and the monthly budget
tailwind.flight-refresh.cooldown-minutes=60

# Aircraft photos: files under the storage root, one photo per aircraft type
tailwind.storage.root-dir=${STORAGE_ROOT}
tailwind.photos.max-bytes=5242880
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=7MB

# Wikimedia Commons for admins picking a photo, no key needed. It asks for a descriptive User-Agent
commons.api-url=https://commons.wikimedia.org/w/api.php
commons.user-agent=kansei-tailwind/1.0 (personal project)
commons.thumb-width=1280
commons.image-hosts=upload.wikimedia.org,thumb.wikimedia.org
