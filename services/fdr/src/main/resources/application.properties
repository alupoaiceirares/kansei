server.port=${SERVER_PORT}
spring.application.name=fdr

# No fallback defaults here on purpose - a missing env var should fail loudly instead of silently trying a guessable/wrong value
# DB_HOST is localhost for mvn/IntelliJ (hits the published port), overridden to the postgres-fdr service name when this app itself runs in the compose network
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.sql

# RabbitMQ - consumes audit.events, see messaging/RabbitMQConfig
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

# In-process retry on a failed delivery (e.g. a DB blip) before giving up - 5 attempts, exponential backoff 1s/2s/4s/8s/16s.
# default-requeue-rejected=false: once retries are exhausted the message is rejected (not requeued), which is what actually routes it to fdr.audit.dlx/dlq via the queue's own dead-letter args
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=5
spring.rabbitmq.listener.simple.retry.initial-interval=1000
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Permanent audit record with a bound - a daily job deletes rows older than this. No fallback on purpose, see AuditRetentionScheduler
fdr.audit.retention-days=${FDR_AUDIT_RETENTION_DAYS}

# ECS-shaped JSON log file for Alloy/Loki, console stays plain. LOG_FILE points at ./logs/fdr/fdr.json locally, /app/logs/fdr.json in the container
logging.file.name=${LOG_FILE}
logging.structured.format.file=ecs
logging.structured.ecs.service.name=fdr
logging.logback.rollingpolicy.max-history=14
logging.logback.rollingpolicy.max-file-size=50MB

# Trace/span ids only correlate log lines across services here - no exporter/backend configured, sampling every request since this is dev-scale
management.tracing.sampling.probability=1.0
# spring-boot-starter-opentelemetry also auto-enables an OTLP *metrics* exporter (separate from tracing), defaulting to push to localhost:4318 every minute regardless - not wanted, we only use this starter for tracing correlation, off explicitly to stop the connection-refused spam
management.otlp.metrics.export.enabled=false

# No business REST API in v1 - the web starter is only here so actuator health has something to run in, for the Docker HEALTHCHECK
management.endpoints.web.exposure.include=health
