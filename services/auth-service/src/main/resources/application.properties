server.port=8081
spring.application.name=auth-service

spring.datasource.url=jdbc:postgresql://localhost:5432/authservice
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.sql

jwt.secret=${JWT_SECRET:1234}
jwt.expiration-ms=86400000

# Deactivated accounts reactivate on login within this window; past it, AccountPurgeScheduler hard-deletes them.
account.deactivation.retention-months=3
account.purge.cron=0 0 3 * * *

# RabbitMQ - publishes mail.events; the courier-one service consumes and actually sends.
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

# No frontend exists yet - links point here until one does; override via FRONTEND_URL.
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.mail.email-verification-expiry-hours=24
app.mail.password-reset-expiry-minutes=60

# Per-IP limit on /register, /verify-email/resend, /password-reset/request - these are the
# endpoints an unauthenticated caller can spam to trigger emails.
app.rate-limit.max-requests=5
app.rate-limit.window-minutes=15