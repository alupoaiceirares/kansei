server.port=${SERVER_PORT}
spring.application.name=wirehood

# No fallback defaults here on purpose - a missing env var should fail loudly instead of silently trying a guessable/wrong value
# DB_HOST is localhost for mvn/IntelliJ (hits the published port)
# R2DBC is the runtime connection (WebFlux, non-blocking) - separate from Liquibase's own JDBC connection below
spring.r2dbc.url=r2dbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.r2dbc.username=${DB_USERNAME}
spring.r2dbc.password=${DB_PASSWORD}

# Liquibase is JDBC-based - runs over its own JDBC datasource at startup, not the R2DBC one above
# Explicit url/user/password here (rather than spring.datasource.*) so Spring Boot builds a dedicated Liquibase-only DataSource instead of trying to autoconfigure a general-purpose one
spring.liquibase.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.liquibase.user=${DB_USERNAME}
spring.liquibase.password=${DB_PASSWORD}
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.sql
