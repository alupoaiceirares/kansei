server.port=${SERVER_PORT}
spring.application.name=wirehood

# ECS-shaped JSON log file for Alloy/Loki, console stays plain. LOG_FILE points at ./logs/wirehood/wirehood.json locally
logging.file.name=${LOG_FILE}
logging.structured.format.file=ecs
logging.structured.ecs.service.name=wirehood
logging.logback.rollingpolicy.max-history=14
logging.logback.rollingpolicy.max-file-size=50MB

# Trace/span ids only correlate log lines across services here - no exporter/backend configured, sampling every request since this is dev-scale
management.tracing.sampling.probability=1.0
# spring-boot-starter-opentelemetry also auto-enables an OTLP *metrics* exporter (separate from tracing), defaulting to push to localhost:4318 every minute regardless - not wanted, we only use this starter for tracing correlation, off explicitly to stop the connection-refused spam
management.otlp.metrics.export.enabled=false
spring.rabbitmq.template.observation-enabled=true
spring.rabbitmq.listener.simple.observation-enabled=true
# Reactive (WebFlux/R2DBC, same reasoning as control-tower) - without this the trace id set on the request thread doesn't survive a hop to another Reactor operator/thread
spring.reactor.context-propagation=auto

management.endpoints.web.exposure.include=health

# No fallback defaults here on purpose - a missing env var should fail loudly instead of silently trying a guessable/wrong value
# DB_HOST is localhost for mvn/IntelliJ (hits the published port)
# R2DBC is the runtime connection (WebFlux, non-blocking) - separate from Liquibase's own JDBC connection below
spring.r2dbc.url=r2dbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.r2dbc.username=${DB_USERNAME}
spring.r2dbc.password=${DB_PASSWORD}

# Liquibase is JDBC-based - runs over its own JDBC datasource at startup, not the R2DBC one above
# Explicit url/user/password here (rather than spring.datasource.*) so Spring Boot builds a dedicated Liquibase-only DataSource instead of trying to autoconfigure a general-purpose one
spring.liquibase.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.liquibase.user=${DB_USERNAME}
spring.liquibase.password=${DB_PASSWORD}
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.sql

# RabbitMQ - download-jobs queue (producer+consumer both here), plus publishes mail.events and audit.events
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
# Confirms/returns so AuditPublisher's callbacks can catch a nack or an unroutable message and fall back to a local file instead of silently losing the event
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

# Caps simultaneous yt-dlp/ffmpeg downloads regardless of queue depth, a retry loop or burst of submissions queues up fine, DownloadJobConsumer just never runs more than max-concurrency at once
spring.rabbitmq.listener.simple.concurrency=2
spring.rabbitmq.listener.simple.max-concurrency=5

# Appended to when a publish to audit.events fails outright or gets nacked/returned - never replayed automatically yet
audit.fallback-file=${AUDIT_FALLBACK_FILE}

# Flat folder structure - categorization stays a DB query concern, not filesystem structure )
wirehood.storage.root-dir=${STORAGE_ROOT}

# Destination for self-disable requests (Account page has no real self-service leave yet, see MailEventPublisher/WirehoodUserService.requestDisable) - no fallback on purpose
wirehood.admin-email=${WIREHOOD_ADMIN_EMAIL}

# Redis - SSE ticket storage for now
# Authenticates as its own scoped ACL user, not the default/full-access user - see docker-compose.yml's redis service
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.username=wirehood
spring.data.redis.password=${REDIS_PASSWORD}
# Same reasoning as shieldwall/control-tower - a stale connection after a redis container recreate
# should fail fast, not hang SSE ticket issuance/username cache lookups indefinitely
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=2s

# Service-to-service call to shieldwall's internal id-to-username lookup (ShieldwallUserClient) - never routed through control-tower. Secret must match INTERNAL_SERVICE_SECRET in services/shieldwall/.env
shieldwall.internal-uri=${SHIELDWALL_INTERNAL_URI}
internal.service-secret=${INTERNAL_SERVICE_SECRET}

# Music profile read side must live under /wirehood/** to match control-tower's routing predicate, default /graphql would 404 through the gateway
# spring.graphql.path is deprecated since Spring for GraphQL 3.5 (no longer actually binds in this Boot 4.1 build) - spring.graphql.http.path is the real property
spring.graphql.http.path=/wirehood/graphql
