server.port=${SERVER_PORT}
spring.application.name=shieldwall

# No fallback defaults here on purpose - a missing env var should fail loudly instead of silently trying a guessable/wrong value
# DB_HOST is localhost for mvn/IntelliJ (hits the published port), overridden to the postgres-shieldwall service name when this app itself runs in the compose network (docker-compose.yml's shieldwall service does this) -
# a container can't reach another container via localhost
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.sql

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# Shared secret checked by InternalUserController - must match INTERNAL_SERVICE_SECRET in any service calling /api/internal/** (e.g. services/wirehood/.env)
internal.service-secret=${INTERNAL_SERVICE_SECRET}

# Deactivated accounts reactivate on login within this window; past it, AccountPurgeScheduler hard-deletes them
account.deactivation.retention-months=3
account.purge.cron=0 0 3 * * *

# RabbitMQ - publishes mail.events; the courier-one service consumes and actually sends
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

# No frontend exists yet - links point here until one does
app.frontend-url=${FRONTEND_URL}
app.mail.email-verification-expiry-hours=1
app.mail.password-reset-expiry-minutes=60

# Per-IP limit on /register, /verify-email/resend, /password-reset/request - these are the endpoints an unauthenticated caller can spam to trigger emails
app.rate-limit.max-requests=5
app.rate-limit.window-minutes=15