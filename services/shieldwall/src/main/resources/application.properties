server.port=${SERVER_PORT}
spring.application.name=shieldwall

# ECS-shaped JSON log file for Alloy/Loki, console stays plain. LOG_FILE points at ./logs/shieldwall/shieldwall.json locally
logging.file.name=${LOG_FILE}
logging.structured.format.file=ecs
logging.structured.ecs.service.name=shieldwall
logging.logback.rollingpolicy.max-history=14
logging.logback.rollingpolicy.max-file-size=50MB

# Trace/span ids only correlate log lines across services here - no exporter/backend configured, sampling every request since this is dev-scale
management.tracing.sampling.probability=1.0
# spring-boot-starter-opentelemetry also auto-enables an OTLP *metrics* exporter (separate from tracing), defaulting to push to localhost:4318 every minute regardless - not wanted, we only use this starter for tracing correlation, off explicitly to stop the connection-refused spam
management.otlp.metrics.export.enabled=false
spring.rabbitmq.template.observation-enabled=true

# No fallback defaults here on purpose - a missing env var should fail loudly instead of silently trying a guessable/wrong value
# DB_HOST is localhost for mvn/IntelliJ (hits the published port), overridden to the postgres-shieldwall service name when this app itself runs in the compose network (docker-compose.yml's shieldwall service does this) -
# a container can't reach another container via localhost
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.sql

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=28800000

# Shared secret checked by InternalUserController - must match INTERNAL_SERVICE_SECRET in any service calling /api/internal/** (e.g. services/wirehood/.env)
internal.service-secret=${INTERNAL_SERVICE_SECRET}

# Same shared Redis instance, shieldwall writes credentials_version bumps here so control-tower can check them without a DB call, see UserService.publishCredentialsVersion
# Authenticates as its own scoped ACL user (~shieldwall:* only), not the default/full-access user, see docker-compose.yml's redis service
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.username=shieldwall
spring.data.redis.password=${REDIS_PASSWORD}
# Explicit command/connect timeouts - without these a stale connection (e.g. after the redis
# container gets recreated while this service is still running) hangs a blocking Lettuce call
# forever instead of throwing, which silently defeats logout()'s otherwise-intended fail-fast
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=2s

# Deactivated accounts reactivate on login within this window; past it, AccountPurgeScheduler hard-deletes them
account.deactivation.retention-months=3
account.purge.cron=0 0 3 * * *

# RabbitMQ - publishes mail.events (courier-one consumes) and audit.events (fdr consumes)
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
# Confirms/returns so AuditPublisher's callbacks can catch a nack or an unroutable message and fall back to a local file instead of silently losing the event
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

# Appended to when a publish to audit.events fails outright or gets nacked/returned - never replayed automatically yet
audit.fallback-file=${AUDIT_FALLBACK_FILE}

# No frontend exists yet - links point here until one does
app.frontend-url=${FRONTEND_URL}
app.mail.email-verification-expiry-hours=1
app.mail.password-reset-expiry-minutes=60

# Per-IP limit on /register, /verify-email/resend, /password-reset/request - these are the endpoints an unauthenticated caller can spam to trigger emails
app.rate-limit.max-requests=5
app.rate-limit.window-minutes=15