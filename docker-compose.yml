# Local dev infra for shieldwall + control-tower + wirehood + courier-one

services:
  # Dedicated to shieldwall - not a shared project-wide Postgres. Each service that needs a DB gets its own container/volume/env-var namespace
  postgres-shieldwall:
    image: postgres:17-alpine
    environment:
      # SHIELDWALL_DB_USERNAME/PASSWORD/NAME read from repo-root .env - must match DB_USERNAME/DB_PASSWORD/DB_NAME in services/shieldwall/.env
      POSTGRES_USER: ${SHIELDWALL_DB_USERNAME}
      POSTGRES_PASSWORD: ${SHIELDWALL_DB_PASSWORD}
      POSTGRES_DB: ${SHIELDWALL_DB_NAME}
    ports:
      # Host-side port from .env - container-side 5432 is fixed by the postgres image itself
      - "${SHIELDWALL_DB_PORT}:5432"
    volumes:
      - shieldwall-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SHIELDWALL_DB_USERNAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Dedicated to wirehood
  postgres-wirehood:
    image: postgres:17-alpine
    environment:
      # WIREHOOD_DB_USERNAME/PASSWORD/NAME read from repo-root .env - must match DB_USERNAME/DB_PASSWORD/DB_NAME in services/wirehood/.env
      POSTGRES_USER: ${WIREHOOD_DB_USERNAME}
      POSTGRES_PASSWORD: ${WIREHOOD_DB_PASSWORD}
      POSTGRES_DB: ${WIREHOOD_DB_NAME}
    ports:
      # Host-side port from .env - container-side 5432 is fixed by the postgres image itself
      - "${WIREHOOD_DB_PORT}:5432"
    volumes:
      - wirehood-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${WIREHOOD_DB_USERNAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Shared across services, wirehood's SSE tickets + username cache, control-tower/wirehood's credentials_version cache default user keeps REDIS_PASSWORD + full access, used for redis-cli/manual debugging and this healthcheck
  # Each app service now authenticates as its own scoped ACL user instead (see spring.data.redis.username in each service's application.properties), not default
  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - "--requirepass"
      - "${REDIS_PASSWORD}"
      - "--user"
      - "shieldwall"
      - "on"
      - ">${SHIELDWALL_REDIS_PASSWORD}"
      - "~shieldwall:*"
      - "+@all"
      - "-@dangerous"
      - "--user"
      - "control-tower"
      - "on"
      - ">${CONTROL_TOWER_REDIS_PASSWORD}"
      - "~control-tower:*"
      - "~shieldwall:credentials-version:*"
      - "+@all"
      - "-@dangerous"
      - "--user"
      - "wirehood"
      - "on"
      - ">${WIREHOOD_REDIS_PASSWORD}"
      - "~wirehood:*"
      - "~shieldwall:credentials-version:*"
      - "+@all"
      - "-@dangerous"
    ports:
      - "127.0.0.1:${REDIS_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      # Overrides the guest/guest default - must match RABBITMQ_USERNAME/PASSWORD in services/shieldwall/.env and services/courier-one/.env. Read from repo-root .env
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      # Host-side ports from .env - container-side 5672/15672 are fixed by the rabbitmq image itself
      - "${RABBITMQ_PORT}:5672"             # AMQP - shieldwall (running locally) connects here
      - "${RABBITMQ_MANAGEMENT_PORT}:15672" # management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  shieldwall:
    profiles: ["full"]
    build:
      context: ./services
      dockerfile: shieldwall/Dockerfile
    env_file:
      - ./services/shieldwall/.env
    environment:
      # Inside the compose network, services reach each other by service name, not localhost - same reasoning as courier-one's RABBITMQ_HOST override below
      DB_HOST: postgres-shieldwall
      DB_PORT: "5432" # container-internal, fixed by the postgres image - not the host-published SHIELDWALL_DB_PORT from .env
      DB_USERNAME: ${SHIELDWALL_DB_USERNAME}
      DB_PASSWORD: ${SHIELDWALL_DB_PASSWORD}
      DB_NAME: ${SHIELDWALL_DB_NAME}
      RABBITMQ_HOST: rabbitmq
      REDIS_HOST: redis
    ports:
      - "${SHIELDWALL_PORT}:${SHIELDWALL_PORT}"
    depends_on:
      postgres-shieldwall:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  control-tower:
    profiles: ["full"]
    build:
      context: ./services
      dockerfile: control-tower/Dockerfile
    env_file:
      - ./services/control-tower/.env
    environment:
      # Inside the compose network, shieldwall/wirehood are reached by service name, not localhost - same reasoning as shieldwall's DB_HOST override above
      SHIELDWALL_URI: http://shieldwall:${SHIELDWALL_PORT}
      WIREHOOD_URI: http://wirehood:${WIREHOOD_PORT}
      REDIS_HOST: redis
    ports:
      - "${CONTROL_TOWER_PORT}:${CONTROL_TOWER_PORT}"
    depends_on:
      # Waits for the HEALTHCHECK baked into each image's Dockerfile (wget against /actuator/health),
      # not just "container started" - a JVM takes a few seconds to actually bind its port and be ready
      shieldwall:
        condition: service_healthy
      wirehood:
        condition: service_healthy
    restart: unless-stopped

  wirehood:
    profiles: ["full"]
    build:
      context: ./services
      dockerfile: wirehood/Dockerfile
    env_file:
      - ./services/wirehood/.env
    environment:
      DB_HOST: postgres-wirehood
      DB_PORT: "5432" # container-internal, fixed by the postgres image - not the host-published WIREHOOD_DB_PORT from .env
      DB_USERNAME: ${WIREHOOD_DB_USERNAME}
      DB_PASSWORD: ${WIREHOOD_DB_PASSWORD}
      DB_NAME: ${WIREHOOD_DB_NAME}
      RABBITMQ_HOST: rabbitmq
      REDIS_HOST: redis
      STORAGE_ROOT: /app/storage
    volumes:
      # Bind mount, not a named volume - downloaded tracks/thumbnails survive `docker-compose down -v` and stay browsable directly on the host
      - ${WIREHOOD_STORAGE_HOST_DIR}:/app/storage
    ports:
      - "${WIREHOOD_PORT}:${WIREHOOD_PORT}"
    depends_on:
      postgres-wirehood:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  courier-one:
    build:
      context: ./services/courier-one
    env_file:
      - ./services/courier-one/.env
    environment:
      # Inside the compose network the broker's hostname is the service name, not localhost
      RABBITMQ_HOST: rabbitmq
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

volumes:
  shieldwall-postgres-data:
  wirehood-postgres-data:
