# Local dev infra for shieldwall + control-tower + wirehood + fdr + tailwind + courier-one

services:
  # Dedicated to shieldwall - not a shared project-wide Postgres. Each service that needs a DB gets its own container/volume/env-var namespace
  postgres-shieldwall:
    image: postgres:17-alpine
    environment:
      # SHIELDWALL_DB_USERNAME/PASSWORD/NAME read from repo-root .env - must match DB_USERNAME/DB_PASSWORD/DB_NAME in services/shieldwall/.env
      POSTGRES_USER: ${SHIELDWALL_DB_USERNAME}
      POSTGRES_PASSWORD: ${SHIELDWALL_DB_PASSWORD}
      POSTGRES_DB: ${SHIELDWALL_DB_NAME}
    ports:
      # Host-side port from .env - container-side 5432 is fixed by the postgres image itself
      - "${SHIELDWALL_DB_PORT}:5432"
    volumes:
      - shieldwall-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SHIELDWALL_DB_USERNAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Dedicated to wirehood
  postgres-wirehood:
    image: postgres:17-alpine
    environment:
      # WIREHOOD_DB_USERNAME/PASSWORD/NAME read from repo-root .env - must match DB_USERNAME/DB_PASSWORD/DB_NAME in services/wirehood/.env
      POSTGRES_USER: ${WIREHOOD_DB_USERNAME}
      POSTGRES_PASSWORD: ${WIREHOOD_DB_PASSWORD}
      POSTGRES_DB: ${WIREHOOD_DB_NAME}
    ports:
      # Host-side port from .env - container-side 5432 is fixed by the postgres image itself
      - "${WIREHOOD_DB_PORT}:5432"
    volumes:
      - wirehood-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${WIREHOOD_DB_USERNAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Dedicated to fdr - the permanent audit record, see infra/postgres-fdr
  postgres-fdr:
    image: postgres:17-alpine
    environment:
      # FDR_DB_USERNAME/PASSWORD/NAME read from repo-root .env - must match DB_USERNAME/DB_PASSWORD/DB_NAME in services/fdr/.env
      POSTGRES_USER: ${FDR_DB_USERNAME}
      POSTGRES_PASSWORD: ${FDR_DB_PASSWORD}
      POSTGRES_DB: ${FDR_DB_NAME}
      # Read by infra/postgres-fdr/init/01-grafana-reader.sh on first init only - the read-only role Grafana's datasource connects as
      FDR_GRAFANA_DB_PASSWORD: ${FDR_GRAFANA_DB_PASSWORD}
    ports:
      # Host-side port from .env - container-side 5432 is fixed by the postgres image itself
      - "${FDR_DB_PORT}:5432"
    volumes:
      - fdr-postgres-data:/var/lib/postgresql/data
      - ./infra/postgres-fdr/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${FDR_DB_USERNAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Dedicated to tailwind
  postgres-tailwind:
    image: postgres:17-alpine
    environment:
      # TAILWIND_DB_USERNAME/PASSWORD/NAME read from repo-root .env - must match DB_USERNAME/DB_PASSWORD/DB_NAME in services/tailwind/.env
      POSTGRES_USER: ${TAILWIND_DB_USERNAME}
      POSTGRES_PASSWORD: ${TAILWIND_DB_PASSWORD}
      POSTGRES_DB: ${TAILWIND_DB_NAME}
    ports:
      # Host-side port from .env - container-side 5432 is fixed by the postgres image itself
      - "${TAILWIND_DB_PORT}:5432"
    volumes:
      - tailwind-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TAILWIND_DB_USERNAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Shared across services, wirehood's SSE tickets + username cache, control-tower/wirehood's credentials_version cache default user keeps REDIS_PASSWORD + full access, used for redis-cli/manual debugging and this healthcheck
  # Each app service now authenticates as its own scoped ACL user instead (see spring.data.redis.username in each service's application.properties), not default
  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - "--requirepass"
      - "${REDIS_PASSWORD}"
      - "--user"
      - "shieldwall"
      - "on"
      - ">${SHIELDWALL_REDIS_PASSWORD}"
      - "~shieldwall:*"
      - "+@all"
      - "-@dangerous"
      - "+info"
      - "--user"
      - "control-tower"
      - "on"
      - ">${CONTROL_TOWER_REDIS_PASSWORD}"
      - "~control-tower:*"
      - "~shieldwall:credentials-version:*"
      - "~shieldwall:blacklisted-jti:*"
      - "+@all"
      - "-@dangerous"
      - "+info"
      - "--user"
      - "wirehood"
      - "on"
      - ">${WIREHOOD_REDIS_PASSWORD}"
      - "~wirehood:*"
      - "~shieldwall:credentials-version:*"
      - "+@all"
      - "-@dangerous"
      - "+info"
      - "--user"
      - "tailwind"
      - "on"
      - ">${TAILWIND_REDIS_PASSWORD}"
      - "~tailwind:*"
      - "+@all"
      - "-@dangerous"
      - "+info"
    ports:
      - "127.0.0.1:${REDIS_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      # Broker admin login (management UI + rabbitmq-init below) - no service authenticates as this
      # one anymore, each gets its own scoped user via rabbitmq-init. Read from repo-root .env
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      # Host-side ports from .env - container-side 5672/15672 are fixed by the rabbitmq image itself
      - "${RABBITMQ_PORT}:5672"             # AMQP - shieldwall (running locally) connects here
      - "${RABBITMQ_MANAGEMENT_PORT}:15672" # management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Creates shieldwall/wirehood/courier-one/fdr as separate scoped RabbitMQ users (regex
  # permissions per service) via the management HTTP API - see infra/rabbitmq/init-users.sh.
  # Runs once per `up`, exits 0 when done; other services wait on service_completed_successfully.
  rabbitmq-init:
    image: curlimages/curl:8.11.0
    entrypoint: ["/bin/sh", "/init-users.sh"]
    volumes:
      - ./infra/rabbitmq/init-users.sh:/init-users.sh:ro
    environment:
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      SHIELDWALL_RABBITMQ_PASSWORD: ${SHIELDWALL_RABBITMQ_PASSWORD}
      WIREHOOD_RABBITMQ_PASSWORD: ${WIREHOOD_RABBITMQ_PASSWORD}
      COURIER_ONE_RABBITMQ_PASSWORD: ${COURIER_ONE_RABBITMQ_PASSWORD}
      FDR_RABBITMQ_PASSWORD: ${FDR_RABBITMQ_PASSWORD}
    depends_on:
      rabbitmq:
        condition: service_healthy

  shieldwall:
    profiles: ["full"]
    build:
      context: ./services
      dockerfile: shieldwall/Dockerfile
    env_file:
      - ./services/shieldwall/.env
    environment:
      # Inside the compose network, services reach each other by service name, not localhost - same reasoning as courier-one's RABBITMQ_HOST override below
      DB_HOST: postgres-shieldwall
      DB_PORT: "5432" # container-internal, fixed by the postgres image - not the host-published SHIELDWALL_DB_PORT from .env
      DB_USERNAME: ${SHIELDWALL_DB_USERNAME}
      DB_PASSWORD: ${SHIELDWALL_DB_PASSWORD}
      DB_NAME: ${SHIELDWALL_DB_NAME}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: shieldwall
      RABBITMQ_PASSWORD: ${SHIELDWALL_RABBITMQ_PASSWORD}
      REDIS_HOST: redis
      LOG_FILE: /app/logs/shieldwall.json
      AUDIT_FALLBACK_FILE: /app/logs/audit-fallback.jsonl
    volumes:
      - ./logs/shieldwall:/app/logs
    ports:
      - "${SHIELDWALL_PORT}:${SHIELDWALL_PORT}"
    depends_on:
      postgres-shieldwall:
        condition: service_healthy
      rabbitmq-init:
        condition: service_completed_successfully
    restart: unless-stopped

  control-tower:
    profiles: ["full"]
    build:
      context: ./services
      dockerfile: control-tower/Dockerfile
    env_file:
      - ./services/control-tower/.env
    environment:
      # Inside the compose network, shieldwall/wirehood are reached by service name, not localhost - same reasoning as shieldwall's DB_HOST override above
      SHIELDWALL_URI: http://shieldwall:${SHIELDWALL_PORT}
      WIREHOOD_URI: http://wirehood:${WIREHOOD_PORT}
      TAILWIND_URI: http://tailwind:${TAILWIND_PORT}
      REDIS_HOST: redis
      LOG_FILE: /app/logs/control-tower.json
    volumes:
      - ./logs/control-tower:/app/logs
    ports:
      - "${CONTROL_TOWER_PORT}:${CONTROL_TOWER_PORT}"
    depends_on:
      # Waits for the HEALTHCHECK baked into each image's Dockerfile (wget against /actuator/health),
      # not just "container started" - a JVM takes a few seconds to actually bind its port and be ready
      shieldwall:
        condition: service_healthy
      wirehood:
        condition: service_healthy
      tailwind:
        condition: service_healthy
    restart: unless-stopped

  wirehood:
    profiles: ["full"]
    build:
      context: ./services
      dockerfile: wirehood/Dockerfile
    env_file:
      - ./services/wirehood/.env
    environment:
      DB_HOST: postgres-wirehood
      DB_PORT: "5432" # container-internal, fixed by the postgres image - not the host-published WIREHOOD_DB_PORT from .env
      DB_USERNAME: ${WIREHOOD_DB_USERNAME}
      DB_PASSWORD: ${WIREHOOD_DB_PASSWORD}
      DB_NAME: ${WIREHOOD_DB_NAME}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: wirehood
      RABBITMQ_PASSWORD: ${WIREHOOD_RABBITMQ_PASSWORD}
      REDIS_HOST: redis
      STORAGE_ROOT: /app/storage
      LOG_FILE: /app/logs/wirehood.json
      AUDIT_FALLBACK_FILE: /app/logs/audit-fallback.jsonl
    volumes:
      # Bind mount, not a named volume - downloaded tracks/thumbnails survive `docker-compose down -v` and stay browsable directly on the host
      - ${WIREHOOD_STORAGE_HOST_DIR}:/app/storage
      - ./logs/wirehood:/app/logs
    ports:
      - "${WIREHOOD_PORT}:${WIREHOOD_PORT}"
    depends_on:
      postgres-wirehood:
        condition: service_healthy
      rabbitmq-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  fdr:
    profiles: ["full"]
    build:
      context: ./services
      dockerfile: fdr/Dockerfile
    env_file:
      - ./services/fdr/.env
    environment:
      DB_HOST: postgres-fdr
      DB_PORT: "5432" # container-internal, fixed by the postgres image - not the host-published FDR_DB_PORT from .env
      DB_USERNAME: ${FDR_DB_USERNAME}
      DB_PASSWORD: ${FDR_DB_PASSWORD}
      DB_NAME: ${FDR_DB_NAME}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: fdr
      RABBITMQ_PASSWORD: ${FDR_RABBITMQ_PASSWORD}
      LOG_FILE: /app/logs/fdr.json
    volumes:
      - ./logs/fdr:/app/logs
    ports:
      - "${FDR_PORT}:${FDR_PORT}"
    depends_on:
      postgres-fdr:
        condition: service_healthy
      rabbitmq-init:
        condition: service_completed_successfully
    restart: unless-stopped

  tailwind:
    profiles: ["full"]
    build:
      context: ./services
      dockerfile: tailwind/Dockerfile
    env_file:
      - ./services/tailwind/.env
    environment:
      DB_HOST: postgres-tailwind
      DB_PORT: "5432" # container-internal, fixed by the postgres image - not the host-published TAILWIND_DB_PORT from .env
      DB_USERNAME: ${TAILWIND_DB_USERNAME}
      DB_PASSWORD: ${TAILWIND_DB_PASSWORD}
      DB_NAME: ${TAILWIND_DB_NAME}
      REDIS_HOST: redis
      SHIELDWALL_INTERNAL_URI: http://shieldwall:${SHIELDWALL_PORT}
      STORAGE_ROOT: /app/storage
      LOG_FILE: /app/logs/tailwind.json
    volumes:
      # Bind mount, not a named volume - aircraft photos survive `docker-compose down -v` and stay browsable directly on the host
      - ${TAILWIND_STORAGE_HOST_DIR}:/app/storage
      - ./logs/tailwind:/app/logs
    ports:
      - "${TAILWIND_PORT}:${TAILWIND_PORT}"
    depends_on:
      postgres-tailwind:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Log store fed by alloy, filesystem storage, 30d retention via the compactor - see infra/loki/config.yaml
  loki:
    image: grafana/loki:3.3.0
    command: -config.file=/etc/loki/config.yaml
    volumes:
      - ./infra/loki/config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Tails ./logs/*/*.json (bind-mounted from every service, container or mvn/IntelliJ writing to the same host path) and ships to loki - see infra/alloy/config.alloy
  alloy:
    image: grafana/alloy:v1.5.1
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    volumes:
      - ./infra/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ./logs:/var/log/kansei:ro
    ports:
      - "127.0.0.1:12345:12345"
    depends_on:
      loki:
        condition: service_healthy

  # UI over the loki and fdr-audit datasources (both provisioned, infra/grafana/provisioning/) - Explore for logs, the audit-trail dashboard for fdr
  grafana:
    image: grafana/grafana:11.3.1
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # Read by infra/grafana/provisioning/datasources/fdr-audit.yml's $__env{} substitution
      FDR_GRAFANA_DB_PASSWORD: ${FDR_GRAFANA_DB_PASSWORD}
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT}:3000"
    depends_on:
      loki:
        condition: service_healthy
      postgres-fdr:
        condition: service_healthy

  courier-one:
    build:
      context: ./services/courier-one
    env_file:
      - ./services/courier-one/.env
    environment:
      # Inside the compose network the broker's hostname is the service name, not localhost
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: courier-one
      RABBITMQ_PASSWORD: ${COURIER_ONE_RABBITMQ_PASSWORD}
      LOG_DIR: /app/logs
    volumes:
      - ./logs/courier-one:/app/logs
    depends_on:
      rabbitmq-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  shieldwall-postgres-data:
  wirehood-postgres-data:
  fdr-postgres-data:
  tailwind-postgres-data:
  loki-data:
  grafana-data:
