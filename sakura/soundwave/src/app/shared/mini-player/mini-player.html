<div class="wh-player">
  <div class="wh-player-track">
    <div class="wh-player-art">
      <span>w</span>
    </div>
    <div class="wh-player-meta">
      @if (nowPlaying) {
        <div class="wh-player-title">{{ nowPlaying.title }}</div>
        <div class="wh-player-artist">{{ nowPlaying.artist }}</div>
      } @else {
        <div class="wh-player-title wh-player-idle">Nothing playing</div>
      }
    </div>
  </div>

  <div class="wh-player-transport">
    <button aria-label="Previous" class="wh-player-btn" (click)="previous.emit()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6z"></path><path d="M20 5v14l-11-7z"></path></svg>
    </button>
    <button aria-label="Play" class="wh-player-btn wh-player-btn-main" (click)="togglePlay.emit()">
      @if (playing) {
        <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h4v14H7zM13 5h4v14h-4z"></path></svg>
      } @else {
        <svg width="13" height="13" viewBox="0 0 12 14" fill="currentColor" style="margin-left: 2px"><path d="M1 1l10 6-10 6z"></path></svg>
      }
    </button>
    <button aria-label="Next" class="wh-player-btn" (click)="next.emit()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2z"></path><path d="M4 5v14l11-7z"></path></svg>
    </button>
  </div>

  <div class="wh-player-scrub">
    <span class="wh-player-time">1:12</span>
    <div class="wh-player-bar">
      <div class="wh-player-bar-fill" style="width: 34%"></div>
    </div>
    <span class="wh-player-time">3:31</span>
  </div>

  <div class="wh-player-volume">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <path d="M4 9h3l4-4v14l-4-4H4z"></path>
      <path d="M16 9a4 4 0 0 1 0 6"></path>
    </svg>
    <div class="wh-player-bar">
      <div class="wh-player-bar-fill wh-player-bar-fill-volume" style="width: 70%"></div>
    </div>
  </div>
</div>
