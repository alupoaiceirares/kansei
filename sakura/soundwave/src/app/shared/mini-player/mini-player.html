<div class="wh-player">
  <div class="wh-player-track">
    <div class="wh-player-art">
      <span>w</span>
      @if (nowPlaying && thumbOk()) {
        <img [src]="thumbnailUrl(nowPlaying.trackId)" alt="" class="wh-thumb-img" (error)="onThumbError()" />
      }
    </div>
    <div class="wh-player-meta">
      @if (nowPlaying) {
        <div class="wh-player-title">{{ nowPlaying.title }}</div>
        <div class="wh-player-artist">{{ nowPlaying.artist }}</div>
      } @else {
        <div class="wh-player-title wh-player-idle">Nothing playing</div>
      }
    </div>
  </div>

  <div class="wh-player-transport">
    <button
      aria-label="Shuffle"
      title="Shuffle"
      class="wh-player-btn wh-player-btn-toggle"
      [class.wh-player-btn-toggle-active]="shuffle"
      (click)="toggleShuffle.emit()"
    >
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M16 3h5v5"></path>
        <path d="M4 20L21 3"></path>
        <path d="M21 16v5h-5"></path>
        <path d="M15 15l6 6"></path>
        <path d="M4 4l5 5"></path>
      </svg>
    </button>
    <button aria-label="Previous" class="wh-player-btn" [disabled]="!hasPrevious" (click)="previous.emit()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6z"></path><path d="M20 5v14l-11-7z"></path></svg>
    </button>
    <button aria-label="Play" class="wh-player-btn wh-player-btn-main" [disabled]="!nowPlaying" (click)="togglePlay.emit()">
      @if (loading) {
        <span class="wh-player-spinner"></span>
      } @else if (playing) {
        <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h4v14H7zM13 5h4v14h-4z"></path></svg>
      } @else {
        <svg width="13" height="13" viewBox="0 0 12 14" fill="currentColor" style="margin-left: 2px"><path d="M1 1l10 6-10 6z"></path></svg>
      }
    </button>
    <button aria-label="Next" class="wh-player-btn" [disabled]="!hasNext" (click)="next.emit()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2z"></path><path d="M4 5v14l11-7z"></path></svg>
    </button>
    <button
      aria-label="Repeat"
      [title]="repeatMode === 'one' ? 'Repeat one' : repeatMode === 'all' ? 'Repeat all' : 'Repeat off'"
      class="wh-player-btn wh-player-btn-toggle"
      [class.wh-player-btn-toggle-active]="repeatMode !== 'off'"
      (click)="cycleRepeat.emit()"
    >
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17 2l4 4-4 4"></path>
        <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
        <path d="M7 22l-4-4 4-4"></path>
        <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
      </svg>
      @if (repeatMode === 'one') {
        <span class="wh-player-repeat-one">1</span>
      }
    </button>
  </div>

  <div class="wh-player-scrub">
    <span class="wh-player-time">{{ formatTime(currentTime) }}</span>
    <div class="wh-player-bar">
      <div class="wh-player-bar-fill" [style.width.%]="progressPermille / 10"></div>
      <input
        type="range"
        class="wh-player-range"
        min="0"
        max="1000"
        [value]="progressPermille"
        [disabled]="!nowPlaying"
        (input)="onSeek($any($event.target).value)"
      />
    </div>
    <span class="wh-player-time">{{ formatTime(duration) }}</span>
  </div>

  <div class="wh-player-volume">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <path d="M4 9h3l4-4v14l-4-4H4z"></path>
      <path d="M16 9a4 4 0 0 1 0 6"></path>
    </svg>
    <div class="wh-player-bar">
      <div class="wh-player-bar-fill wh-player-bar-fill-volume" [style.width.%]="volume * 100"></div>
      <input type="range" class="wh-player-range" min="0" max="100" [value]="volume * 100" (input)="onVolume($any($event.target).value)" />
    </div>
  </div>

  <button aria-label="Close player" title="Close player" class="wh-player-close" (click)="close.emit()">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
  </button>
</div>
